# Publishes the gem when a matching v* tag is pushed, using RubyGems trusted
# publishing (OIDC) instead of a long-lived API key.
#
# One-time setup for the first release:
#   RubyGems.org profile → Trusted publishers → Create pending publisher
#   gem: product_tours
#   repository owner: yshmarov
#   repository: product_tours
#   workflow: release.yml
#   environment: release
#
# Release flow after that:
#   git tag vX.Y.Z && git push origin vX.Y.Z
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Verify tag matches gem version
        run: |
          version="$(ruby -Ilib -r product_tours/version -e 'print ProductTours::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Validate release
        run: |
          bundle exec rake test
          bundle exec rake test:system
          bundle exec rubocop
          node --check lib/product_tours/dashboard.js
          node --check lib/product_tours/widget.js
          gem build product_tours.gemspec
      - name: Check whether this version is already published
        id: release
        env:
          GEM_NAME: product_tours
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ruby -rjson -rnet/http -ruri -e '
            name, version = ARGV
            uri = URI("https://rubygems.org/api/v1/versions/#{name}.json")
            versions = JSON.parse(Net::HTTP.get(uri))
            exit(versions.any? { |item| item.fetch("number") == version } ? 0 : 1)
          ' "$GEM_NAME" "$version"
          then
            echo "$GEM_NAME $version is already published; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        if: steps.release.outputs.needed == 'true'
      - name: Build and publish
        if: steps.release.outputs.needed == 'true'
        run: |
          gem push product_tours-*.gem
      - name: Verify the published version
        env:
          GEM_NAME: product_tours
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6
          do
            if ruby -rjson -rnet/http -ruri -e '
              name, version = ARGV
              uri = URI("https://rubygems.org/api/v1/versions/#{name}.json")
              versions = JSON.parse(Net::HTTP.get(uri))
              exit(versions.any? { |item| item.fetch("number") == version } ? 0 : 1)
            ' "$GEM_NAME" "$version"
            then
              exit 0
            fi
            echo "RubyGems has not indexed $GEM_NAME $version yet (attempt $attempt/6)."
            sleep 5
          done
          exit 1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1
          then
            echo "$GITHUB_REF_NAME already has a GitHub release."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "product_tours $GITHUB_REF_NAME"
          fi
